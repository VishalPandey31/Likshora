services:
  - type: web
    name: likshora-api
    runtime: python
    region: singapore  # closest to India — low latency
    plan: free      # $7/mo — no cold starts, always-on (RECOMMENDED for production)
    # plan: free       # Free tier — has cold starts (~30s first request after idle)
    rootDir: backend
    buildCommand: pip install -r requirements.txt && flask db upgrade
    startCommand: gunicorn -w 4 -b 0.0.0.0:$PORT --timeout 120 --access-logfile - --error-logfile - run:app
    healthCheckPath: /api/v1/health
    autoDeploy: true   # auto-redeploy on every git push
    envVars:
      - key: FLASK_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DATABASE_URL
        sync: false
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: SUPABASE_VERIFY_SSL
        value: "false"
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: SHIPROCKET_EMAIL
        sync: false
      - key: SHIPROCKET_PASSWORD
        sync: false
      - key: SHIPROCKET_WEBHOOK_TOKEN
        sync: false
      - key: SHIPROCKET_PICKUP_LOCATION
        value: Primary
      - key: CORS_ORIGINS
        value: https://likshora.com,https://www.likshora.com
