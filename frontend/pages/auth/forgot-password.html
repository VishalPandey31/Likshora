<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIKSHORA — Forgot Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Modular Relative CSS Resources -->
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/responsive.css">
<link rel="stylesheet" href="../../css/authentication.css">
</head>
<body class="auth-page-body">

<div class="auth-page-shell">

  <!-- Form Side -->
  <div class="auth-form-side">
    <div class="auth-header text-center">
      <h1>Forgot Password</h1>
      <p class="auth-subtitle">Enter your registered email address and we'll send you instructions to reset your password.</p>
    </div>

    <form id="forgotPasswordForm">
      <div class="auth-form-group">
        <label class="auth-label">Registered Email
          <input type="email" id="resetIdentity" class="auth-input" required placeholder="Enter your registered email">
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block auth-btn-submit">SEND RESET LINK &rarr;</button>

      <p class="auth-note" style="margin-top:1.5em; text-align:center; font-size:.88rem; text-shadow:0 1px 2px rgba(255,255,255,0.85);"><a href="login.html" class="auth-link-terra">&larr; Back to Login</a></p>
    </form>
  </div>

</div>

<!-- Modular Relative JavaScript Resources -->
<script src="../../js/config.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/formatters.js"></script>
<script src="../../js/utils/validation.js"></script>
<script src="../../js/utils/helpers.js"></script>
<script src="../../js/components/toast.js"></script>
<script src="../../js/api/api.js"></script>
<script src="../../js/api/auth-api.js"></script>

<!-- Forgot Password Controller -->
<script src="../../js/auth/forgot-password.js"></script>
</body>
</html>
