<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LIKSHORA — Create Password</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Work+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">

<!-- Modular Relative CSS Resources -->
<link rel="stylesheet" href="../../css/variables.css">
<link rel="stylesheet" href="../../css/global.css">
<link rel="stylesheet" href="../../css/responsive.css">
<link rel="stylesheet" href="../../css/authentication.css">
</head>
<body class="auth-page-body">

<div class="auth-page-shell">

  <!-- Right Form Side -->
  <div class="auth-form-side">
    <div class="auth-header">
      <p class="eyebrow">Step 3 of 3</p>
      <h1>Create a Password</h1>
      <p>Set a strong password for your new LIKSHORA account.</p>
    </div>

    <form id="passwordCreationForm">
      <div class="auth-form-group">
        <label class="auth-label">New Password
          <div class="password-field-wrap">
            <input type="password" id="newPassword" class="auth-input" required minlength="6" placeholder="At least 6 characters">
            <button type="button" class="eye-toggle-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
          <div class="strength-bar-wrap">
            <div class="strength-bar-fill" id="strengthBarFill"></div>
          </div>
        </label>

        <label class="auth-label">Confirm Password
          <div class="password-field-wrap">
            <input type="password" id="confirmPassword" class="auth-input" required minlength="6" placeholder="Re-enter password">
            <button type="button" class="eye-toggle-btn" aria-label="Toggle password visibility">👁️</button>
          </div>
        </label>
      </div>

      <button type="submit" class="btn btn-primary btn-block" style="height:48px; font-size:.9rem;">Complete Account &amp; Log In &rarr;</button>
    </form>
  </div>

</div>

<!-- Modular Relative JavaScript Resources -->
<script src="../../js/config.js"></script>
<script src="../../js/utils/storage.js"></script>
<script src="../../js/utils/formatters.js"></script>
<script src="../../js/utils/validation.js"></script>
<script src="../../js/utils/helpers.js"></script>
<script src="../../js/components/toast.js"></script>

<!-- Signup Controller -->
<script src="../../js/auth/signup.js"></script>
</body>
</html>
