<!-- Reusable Admin Header Component -->
<header class="admin-header">
  <div class="admin-header-left">
    <h2 class="admin-header-title" id="adminHeaderTitle">Dashboard</h2>
  </div>

  <div class="admin-header-right">
    <button class="icon-btn" aria-label="Notifications" style="position:relative;">
      <svg viewBox="0 0 24 24"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span style="position:absolute; top:2px; right:2px; width:8px; height:8px; border-radius:50%; background:var(--rust);"></span>
    </button>

    <div class="admin-profile-chip">
      <div class="admin-chip-avatar" id="adminHeaderAvatar">AD</div>
      <span style="font-size:.84rem; font-weight:600;" id="adminHeaderName">Admin</span>
    </div>
  </div>
</header>
